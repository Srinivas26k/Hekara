services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hekara
      POSTGRES_PASSWORD: hekara
      POSTGRES_DB: hekara
    ports: ["5442:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hekara"]
      interval: 5s
      retries: 10
volumes:
  dbdata:
