name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hekara
          POSTGRES_PASSWORD: hekara
          POSTGRES_DB: hekara
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U hekara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hekara:hekara@localhost:5442/hekara
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm build
